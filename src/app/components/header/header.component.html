<header>
  <div class="header-left h-card">
    <a [routerLink]="['']" class="home-link u-url" aria-label="Iris, home page">
      <img
        id="profile-picture"
        class="u-photo"
        ngSrc="/index/pfp.webp"
        sizes="50px"
        ngSrcset="50w, 100w, 200w"
        alt=""
        width="512"
        height="512"
        priority="" />
      <span id="wobble" class="p-name" aria-hidden="true">
        <span class="wobble wobble1">I</span>
        <span class="wobble wobble2">r</span>
        <span class="wobble wobble3">i</span>
        <span class="wobble wobble4">s</span>
      </span>
    </a>
  </div>

  <button type="button" class="hamburger" aria-label="Menu" popovertarget="site-menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="site-menu" class="menu" aria-label="Main" popover>
    <a href="https://donate.irisnk.me/" target="_blank" rel="noopener noreferrer" [attr.tabindex]="null">Donate</a>
    <a href="https://archive.irisnk.me/" target="_blank" rel="noopener noreferrer" [attr.tabindex]="null">Music</a>
    <a [routerLink]="['git']" routerLinkActive="active" [attr.tabindex]="null">Git</a>
    <a [routerLink]="['contact']" routerLinkActive="active" [attr.tabindex]="null">Contact</a>
    <a [routerLink]="['keys']" routerLinkActive="active" [attr.tabindex]="null">Keys</a>
    <a [routerLink]="['blog']" routerLinkActive="active" [attr.tabindex]="null">Blog</a>
    <a [routerLink]="['']" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [attr.tabindex]="null"
      >Home</a
    >
  </nav>
</header>
