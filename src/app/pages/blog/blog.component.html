<section class="info center column">
  <h1 class="page-title">Blog</h1>
  <div class="little-wrapper">
    <p class="explainer">Thoughts, rants, and 100% human.<br />Free, without cookies, and never sponsored.</p>
    <div class="icons">
      <a href="/blog/feed.xml" download type="application/rss+xml" title="RSS feed" aria-label="RSS feed">
        <svg
          id="rss-icon"
          aria-hidden="true"
          focusable="false"
          xmlns="http://www.w3.org/2000/svg"
          fill="currentColor"
          viewBox="0 0 16 16">
          <path
            d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zm1.5 2.5c5.523 0 10 4.477 10 10a1 1 0 1 1-2 0 8 8 0 0 0-8-8 1 1 0 0 1 0-2m0 4a6 6 0 0 1 6 6 1 1 0 1 1-2 0 4 4 0 0 0-4-4 1 1 0 0 1 0-2m.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3" />
        </svg>
      </a>
      <a href="/blog/atom.xml" download type="application/atom+xml" title="Atom feed" aria-label="Atom feed">
        <svg
          id="atom-icon"
          aria-hidden="true"
          focusable="false"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path d="M12 12v.01" />
          <path
            d="M19.071 4.929c-1.562 -1.562 -6 .337 -9.9 4.243c-3.905 3.905 -5.804 8.337 -4.242 9.9c1.562 1.561 6 -.338 9.9 -4.244c3.905 -3.905 5.804 -8.337 4.242 -9.9" />
          <path
            d="M4.929 4.929c-1.562 1.562 .337 6 4.243 9.9c3.905 3.905 8.337 5.804 9.9 4.242c1.561 -1.562 -.338 -6 -4.244 -9.9c-3.905 -3.905 -8.337 -5.804 -9.9 -4.242" />
        </svg>
      </a>
      <a href="/blog/feed.json" download type="application/feed+json" title="JSON feed" aria-label="JSON feed">
        <svg
          id="jsonfeed-icon"
          aria-hidden="true"
          focusable="false"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="-10 0 1034 1024">
          <path
            fill="currentColor"
            d="M854 175q-27 0 -46 19t-19 45.5t18.5 45t45 18.5t45.5 -18.5t19 -45t-18.5 -45.5t-44.5 -19zM205 192l-34 34q-83 83 -88 154t68 144l82 82q45 46 48.5 78t-33.5 69v0q-16 19 -15.5 44.5t18.5 43.5t43.5 18.5t44.5 -15.5l1 1q25 -25 47 -32t45.5 4.5t53.5 41.5l95 96 q75 74 147.5 70t155.5 -87l33 -34l-71 -72l-18 18q-47 47 -84 47.5t-82 -44.5l-112 -112q-86 -86 -169 -17l-11 -11q35 -42 31.5 -83t-45.5 -82l-100 -101q-31 -31 -40.5 -56.5t1 -51.5t42.5 -59l17 -17zM703 326q-28 0 -46.5 19t-18.5 45.5t18.5 45.5t45 19t45.5 -19 t19 -45.5t-18.5 -45t-44.5 -19.5zM551 477q-27 0 -46 19t-19 45.5t19 45.5t45.5 19t45.5 -19t19 -45.5t-19 -45t-45 -19.5z" />
        </svg>
      </a>
    </div>
  </div>
  <hr />
  <ul class="dotted-list">
    @for (post of posts; track post.slug) {
      <li>
        <a [routerLink]="['/blog', post.slug]" class="post-link">{{ post.title }}</a>
        <span class="post-meta">
          :: <time [attr.datetime]="post.date">{{ post.date | date: 'longDate' }}</time></span
        >
        <p class="post-desc">{{ post.description }}</p>
      </li>
    }
  </ul>
</section>
